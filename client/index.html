<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>XArcanoid</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="shell">
        <header class="top_bar">
            <div class="brand">
                <span class="brand_mark">■</span>
                <h1>XArcanoid</h1>
            </div>
        </header>

        <div class="layout">
            <aside class="panel">
                <button type="button" id="lang_btn" class="lang_btn" aria-label="Язык">
                    <span data-lang="ru">RU</span>
                    <span data-lang="en">EN</span>
                </button>

                <label class="theme_picker">
                    <span data-i18n="theme">Тема</span>
                    <select id="theme_select"></select>
                </label>

                <label class="theme_picker">
                    <span data-i18n="difficulty">Сложность</span>
                    <select id="difficulty_select">
                        <option value="practice" data-i18n="diff_practice">Тренировка</option>
                        <option value="standard" selected data-i18n="diff_standard">Обычная</option>
                        <option value="overdrive" data-i18n="diff_overdrive">Разгон</option>
                    </select>
                </label>

                <section class="card" id="auth_card">
                    <div class="player_head">
                        <h2 data-i18n="player">Игрок</h2>
                        <span id="player_name" class="player_name hidden"></span>
                    </div>
                    <p class="status guest" id="auth_status">Гость — счёт в таблицу не попадёт</p>

                    <form id="auth_form" class="auth_form">
                        <label>
                            <span data-i18n="username">Имя</span>
                            <input id="username_input" name="username" autocomplete="username" maxlength="20">
                        </label>
                        <label>
                            <span data-i18n="password">Пароль</span>
                            <input id="password_input" name="password" type="password" autocomplete="current-password" maxlength="64">
                        </label>
                        <div class="row_btns">
                            <button type="submit" id="login_btn" data-i18n="login">Войти</button>
                            <button type="button" id="register_btn" class="ghost" data-i18n="register">Регистрация</button>
                        </div>
                    </form>

                    <button type="button" id="logout_btn" class="ghost hidden" data-i18n="logout">Выйти</button>
                    <p class="error" id="auth_error"></p>
                </section>

                <section class="card">
                    <h2 data-i18n="leaders">Лидеры</h2>
                    <ol id="leaderboard_list" class="leaderboard"></ol>
                    <p class="hint" id="leaderboard_empty" data-i18n="leaderboard_empty">Пока пусто — сломай пару кирпичей.</p>
                </section>
            </aside>

            <section class="stage">
                <div class="hud">
                    <span><span data-i18n="score">очки</span> <strong id="hud_score">0</strong></span>
                    <span><span data-i18n="combo">комбо</span> <strong id="hud_combo">0</strong></span>
                    <span><span data-i18n="time">время</span> <strong id="hud_time">0:00</strong></span>
                    <span><span data-i18n="lives">жизни</span> <strong id="hud_lives">3</strong></span>
                    <span><span data-i18n="level">уровень</span> <strong id="hud_level">1</strong></span>
                </div>
                <div class="canvas_wrap">
                    <canvas id="game_canvas" width="720" height="480"></canvas>
                    <div id="overlay" class="overlay">
                        <p id="overlay_title">XArcanoid</p>
                        <p id="overlay_text">Стрелки или A/D — каретка. Пробел — пуск шара.</p>
                        <button type="button" id="start_btn">Играть</button>
                    </div>
                </div>
                <button type="button" id="end_btn" class="ghost end_btn hidden" data-i18n="end_run">Завершить</button>
                <p class="hint controls_hint" data-i18n="controls_hint">Мышь тоже двигает каретку. P — пауза, пробел — пауза пока шар не запущен.</p>
            </section>
        </div>
    </div>

    <script src="/js/i18n.js"></script>
    <script src="/js/themes.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/game.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
